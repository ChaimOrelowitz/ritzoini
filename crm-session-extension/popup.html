<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; width: 300px; padding: 16px; margin: 0; color: #1e293b; }
    h2 { margin: 0 0 12px; font-size: 1rem; color: #1e3a8a; }
    label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 0.82rem; }
    button { width: 100%; padding: 9px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem; font-weight: 700; margin-top: 10px; }
    .primary { background: #1e3a8a; color: white; }
    .outline { background: white; color: #1e3a8a; border: 1.5px solid #1e3a8a; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 12px; padding: 9px 10px; border-radius: 6px; font-size: 0.78rem; line-height: 1.45; background: #f8fafc; border: 1px solid #e2e8f0; }
    .ok  { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .bad { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .muted { color: #64748b; font-size: 0.72rem; margin-top: 3px; }
    details { margin-top: 10px; font-size: 0.78rem; color: #64748b; }
  </style>
</head>
<body>
  <h2>Ritzoini CRM Session</h2>

  <label for="token">Extension token</label>
  <input id="token" type="password" placeholder="From Co-Sign ⚙ Settings → CRM Connection">

  <label for="machineName">This machine's name</label>
  <input id="machineName" placeholder="e.g. Office laptop">

  <details>
    <summary>Advanced</summary>
    <label for="apiBase">Ritzoini server</label>
    <input id="apiBase" placeholder="https://ritzoini.onrender.com">
  </details>

  <button class="outline" id="save">Save</button>
  <button class="primary" id="send">Send session now</button>

  <div class="status" id="status">No session sent yet.</div>

  <script src="popup.js"></script>
</body>
</html>
